<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>晚餐抽籤小幫手</title>
    <link rel="stylesheet" href="dist/output.css">
</head>
<body>
    <header class="sticky top-0 z-10 card-glass border-b border-slate-700/60">
        <div class="mx-auto max-w-screen-lg px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="h-8 w-8 rounded-full bg-gradient-to-br from-[--color-primary] to-[--color-accent] shadow-[--shadow-neon]"></div>
                <span class="text-sm text-[--color-text-muted]">晚餐抽籤小幫手</span>
            </div>
            <a href="#" class="btn-outline text-sm">關於</a>
        </div>
    </header>

    <main class="mx-auto max-w-screen-lg px-6">
        <section class="text-center py-14">
            <h1 class="text-4xl sm:text-5xl font-semibold tracking-tight">今晚吃什麼？</h1>
            <p class="mt-3 text-[--color-text-muted]">按下開始，讓霓虹為你做決定。</p>
        </section>

        <section class="card-glass px-6 py-8">
            <div id="result" role="status" aria-live="polite" class="result text-3xl font-semibold text-center py-8 rounded-[--radius-lg] border border-slate-700/60 bg-black/10">按下開始抽籤</div>
            <div class="mt-6 flex items-center justify-center gap-4">
                <button id="start" class="btn-primary">開始抽籤</button>
                <button id="stop" class="btn-outline" disabled>停止抽籤</button>
            </div>
        </section>
        <section class="card-glass menu-editor" aria-labelledby="menu-title">
            <h2 id="menu-title">我的餐點清單</h2>
            <p>新增喜歡的餐點，或刪除今天不想吃的選項。清單只保存在這個瀏覽器。</p>
            <form id="menu-form">
                <label for="menu-input">餐點名稱</label>
                <div class="menu-entry">
                    <input id="menu-input" name="dinner" type="text" autocomplete="off" required>
                    <button class="btn-primary" type="submit">新增餐點</button>
                </div>
            </form>
            <p id="menu-status" role="status" aria-live="polite"></p>
            <ul id="menu-list" aria-label="抽籤餐點"></ul>
        </section>
    </main>
    <script src="menu.js"></script>
    <script src="script.js"></script>
</body>
</html>
